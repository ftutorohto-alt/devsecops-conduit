name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-tests.txt
      - run: python -m pytest tests/unit -v

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --log-opts=HEAD --no-banner -v

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit-local-only
          POSTGRES_DB: conduit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: prod
      SECRET_KEY: local-ci-secret-key-32-chars-long!
      JWT_SECRET_KEY: local-ci-jwt-secret-key-32-chars!
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit-local-only
      POSTGRES_DB: conduit
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r requirements-tests.txt
      - name: Prepare database
        working-directory: backend
        run: python -m alembic -c alembic.ini upgrade head
      - name: Start API
        run: |
          nohup python -m uvicorn conduit.app:app --app-dir backend --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          timeout 30 bash -c 'until curl -fs http://127.0.0.1:8000/api/health-check; do sleep 1; done'
      - name: Run integration tests
        run: python -m pytest tests/integration -v
      - name: Show API logs on failure
        if: failure()
        run: cat api.log 2>/dev/null || true
